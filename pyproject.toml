[project]
name = "biomarkit"
version = "0.1.0"
description = "Downloads full-text scientific publications from a Scopus query and converts them into standardised Markdown."
requires-python = ">=3.12,<3.14"
dependencies = [
    "coverage>=7.11.0",
    "dotenv>=0.9.9",
    "mineru[pipeline]>=3.4.0",
    "openai>=1.0.0",
    "pandas>=2.3.3",
    "playwright>=1.56.0",
    "plotly>=6.5.0",
    "pydantic>=2.12.0",
    "pytest>=8.4.2",
    "requests>=2.32.5",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "tqdm>=4.67.0",
    "wiley-tdm>=1.0.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

# Coverage settings (don't test the tests)!
[tool.coverage.run]
omit = [
    "tests/*",
    "*/tests/*",
]
[tool.coverage.report]
omit = [
    "tests/*",
    "*/tests/*",
]

# Stop coverage from running on __main__ codeblocks.
exclude_lines = [
    "if __name__ == \"__main__\":"
]